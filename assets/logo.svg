<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#16213e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Main Rounded Background -->
  <rect x="64" y="64" width="896" height="896" rx="160" fill="url(#bgGradient)" stroke="#0f3460" stroke-width="20" />
  
  <!-- Stylized Monitor Frame -->
  <rect x="160" y="200" width="704" height="500" rx="40" fill="none" stroke="#4fc3f7" stroke-width="40" opacity="0.8" />
  
  <!-- Command Prompt Text -->
  <path d="M280 320 L420 450 L280 580" fill="none" stroke="#4fc3f7" stroke-width="60" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- Blinking Cursor -->
  <rect x="480" y="520" width="140" height="60" fill="#4fc3f7" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
  </rect>
  
  <!-- Connectivity Dots -->
  <circle cx="512" cy="800" r="30" fill="#4fc3f7" opacity="0.6" />
  <circle cx="612" cy="800" r="20" fill="#4fc3f7" opacity="0.3" />
  <circle cx="412" cy="800" r="20" fill="#4fc3f7" opacity="0.3" />
</svg>
